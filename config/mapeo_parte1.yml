# =============================================================================
# Mapeo Parte 1 -> CIS vigente suministrado (aprobado 2026-10-12)
# =============================================================================
# Fuente: input/baseline/"Linea Base - Analisis de Impacto _Parte1.xlsx", hoja "SLES15-ORA8-9".
# La numeración de la Parte 1 corresponde a una generación anterior del Benchmark (estilo
# RHEL 7 / CIS v2-v3). El número del Excel NO es autoridad: cada fila se mapea al control
# vigente de cada PDF de input/cis/ por título y requisito, revisado por el auditor.
#
# Familias de Benchmark (el constructor verifica cada id en CADA benchmark de la familia y
# que su título contenga el patrón de la fila; si no, falla):
#   v2   = ORACLE9 v2.0.0 y RHEL9 v2.0.0
#   v4   = ORACLE8 v4.0.0 y RHEL8 v4.0.0 (sysctl de red y permisos divididos en más controles)
#   sles = SLES15 v2.0.1
#
# estado (por familia o común):
#   MAPEADO                    mismo requisito, renumerado
#   MAPEADO_TITULO_ACTUALIZADO mismo requisito con redacción/alcance actualizado
#   MAPEADO_CONSOLIDADO        la fila quedó absorbida en un control CIS más amplio
#   MAPEADO_DIVIDIDO           la fila corresponde a varios controles CIS actuales
#   RETIRADO                   no existe en el Benchmark suministrado (búsqueda verificada)
#   NO_APLICA_PLATAFORMA       el mecanismo no existe en esa plataforma (p. ej. authselect en SLES)
#
# patron: expresión que debe aparecer en el título CIS de TODOS los ids indicados.
# criterio_excel: valor exigido por la línea base cuando difiere del CIS (se documenta; el
#   Resultado CIS siempre usa el criterio del Benchmark).
# =============================================================================

filas:
