---
# Exclusiones de Infraestructura de la Parte 1 posteriores a la línea base (decisiones de Infraestructura Linux).
#
# Complementan la columna "Exclusiones de Infraestructura" del Excel P1, que no se modifica. Reglas:
#   - Solo TIPO USUARIOS. Los usuarios se UNEN a los de la celda del Excel para el mismo control: nunca reemplazan ni
#     eliminan usuarios de la línea base, ni crean otro tipo de exclusión.
#   - sistemas: perfiles de auditoría en los que aplica (RHEL_ORACLE_8, RHEL_ORACLE_9, SLES_15).
#   - benchmarks (opcional): restringe la entrada a benchmarks concretos (ORACLE8, ORACLE9, RHEL8, RHEL9, SLES15), p. ej.
#     solo Red Hat dentro del perfil RHEL_ORACLE_x.
#   - Un usuario declarado solo se considera exceptuado si existe en el servidor y su configuración real es la que la
#     política CIS no permite (validación usuario por usuario); la exclusión nunca cambia el resultado CIS técnico.
origen: "Solicitud de corrección integral de la auditoría CIS Linux, Infraestructura Linux, 2026-10-27"
exclusiones_p1:
  - control_excel: "5.2.4"          # CIS 5.2.4 Ensure users must provide password for escalation
    usuarios: [cchaves, jcantor, srvinnops]
    sistemas: [RHEL_ORACLE_8, RHEL_ORACLE_9, SLES_15]
    motivo: "Usuarios administradores autorizados por Infraestructura para conservar NOPASSWD."
  - control_excel: "5.5.3"          # CIS 5.4.1.3 Ensure password expiration warning days is configured
    usuarios: [root]
    sistemas: [SLES_15]
    motivo: "Cuenta root exceptuada por Infraestructura del aviso de expiración de contraseña (PASS_WARN_AGE por cuenta)."
  - control_excel: "5.5.6"          # CIS 5.4.2.7 / 5.4.2.8 cuentas de sistema
    usuarios: [nobody, rtkit, brltty]
    sistemas: [SLES_15]
    motivo: "Cuentas utilizadas por componentes de SLES 15; su shell y bloqueo se conservan por decisión de Infraestructura."
  - control_excel: "5.5.6"          # CIS 5.4.2.7 / 5.4.2.8 cuentas de sistema (Red Hat Enterprise Linux)
    usuarios: [pcpqa]
    sistemas: [RHEL_ORACLE_8, RHEL_ORACLE_9]
    benchmarks: [RHEL8, RHEL9]
    motivo: "Cuenta de servicio pcpqa en Red Hat Enterprise Linux; su shell se conserva por decisión de Infraestructura."

# Parte 2 (filas sin exclusión en el Excel P2): solo usuarios, por control CIS. Mismas reglas de unión y alcance.
exclusiones_p2:
  - control_cis: "7.2.8"            # CIS 7.2.8 Ensure local interactive user home directories are configured
    usuarios: [pcpqa]
    sistemas: [RHEL_ORACLE_8, RHEL_ORACLE_9]
    benchmarks: [RHEL8, RHEL9]
    motivo: "Cuenta de servicio pcpqa en Red Hat Enterprise Linux; la configuración de su directorio home se conserva por decisión de Infraestructura."
