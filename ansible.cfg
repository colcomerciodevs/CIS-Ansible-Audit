# Configuración Ansible para la recolección de evidencias CIS (solo lectura).
[defaults]
inventory = inventory/hosts.yml
filter_plugins = plugins/filter
# Sin recolección de facts: el módulo setup copia código al host. Todo se hace con raw.
gathering = explicit
host_key_checking = True
retry_files_enabled = False
forks = 10
timeout = 30
# Nunca solicitar contraseñas de forma interactiva.
ask_pass = False

[privilege_escalation]
# La elevación se hace explícitamente con "sudo -n" dentro de cada comando.
become = False
become_ask_pass = False

[ssh_connection]
# Autenticación solo por llave; sin contraseña ni teclado interactivo; sin TTY
# (stdout y stderr separados, sin transformación de saltos de línea).
ssh_args = -o BatchMode=yes -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ControlMaster=auto -o ControlPersist=60s
usetty = False
pipelining = False
